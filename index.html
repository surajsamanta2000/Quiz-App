<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beautiful Quiz App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card shadow-lg p-4 rounded-4">
      <div class="card-body">
        <h2 class="text-center mb-4 text-primary fw-bold">📝 Create & Take Quiz</h2>

        <!-- Form Section -->
        <div id="formSection">
          <div class="row g-3 mb-3">
            <div class="col-12">
              <input type="text" class="form-control" id="question" placeholder="Enter Question">
            </div>
            <div class="col-md-4">
              <input type="text" class="form-control" id="option1" placeholder="Option 1">
            </div>
            <div class="col-md-4">
              <input type="text" class="form-control" id="option2" placeholder="Option 2">
            </div>
            <div class="col-md-4">
              <input type="text" class="form-control" id="option3" placeholder="Option 3">
            </div>
            <div class="col-12">
              <input type="text" class="form-control" id="correct" placeholder="Correct Answer">
            </div>
          </div>

          <div class="d-flex justify-content-between">
            <button class="btn btn-outline-primary" onclick="addQuestion()">➕ Add Question</button>
            <button class="btn btn-success" onclick="startQuiz()">🚀 Start Quiz</button>
          </div>
        </div>

        <!-- Quiz Section -->
        <div id="quizSection" class="mt-4" style="display: none;">
          <div id="quizContainer"></div>
          <button class="btn btn-primary mt-4 w-100" onclick="submitQuiz()">Submit Quiz</button>
          <div id="result" class="alert alert-info text-center mt-4 fw-bold d-none"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
